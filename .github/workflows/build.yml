name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with csc.exe
        shell: pwsh
        run: ./build.ps1

      - name: Upload DefenderRestore.exe
        uses: actions/upload-artifact@v4
        with:
          name: DefenderRestore
          path: dist/DefenderRestore.exe
          if-no-files-found: error
